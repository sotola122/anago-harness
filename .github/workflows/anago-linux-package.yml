name: Package Desktop · Linux · x64

on:
  workflow_dispatch:
  # Pull requests get a manual entry point: label the pull request `package-desktop`.
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'package-desktop'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Warm the Electron cache
        # GitHub release downloads intermittently answer 504. Fetch the archive through the authenticated
        # API, verify it against Electron's published digest, and place it where @electron/get looks.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          electron="$(node -p "const p=require('./apps/desktop/package.json');((p.dependencies&&p.dependencies.electron)||(p.devDependencies&&p.devDependencies.electron)||'').replace(/^[^0-9]*/, '')")"
          test "$electron" = '44.7.0' || { echo "electron moved to $electron; update the digest in this step"; exit 1; }
          mkdir -p "$RUNNER_TEMP/electron"
          gh release download "v$electron" -R electron/electron -p "electron-v$electron-linux-x64.zip" -D "$RUNNER_TEMP/electron" --clobber
          printf '%s  %s\n' '3ae7d5bdad61c664486c6ab61361dd084d064c8c08af8d13a687096e18ce555a' "$RUNNER_TEMP/electron/electron-v$electron-linux-x64.zip" | sha256sum -c -
          cache="apps/desktop/.desktop-build/downloads/$(printf '%s' "https://github.com/electron/electron/releases/download/v$electron" | sha256sum | cut -d' ' -f1)"
          mkdir -p "$cache"
          cp "$RUNNER_TEMP/electron/electron-v$electron-linux-x64.zip" "$cache/"
      - name: Write packaging environment
        # Linux packaging reads .env.linux; an unsigned AppImage needs only the application identifier.
        env:
          DSH_DESKTOP_APP_ID: ${{ vars.DSH_DESKTOP_APP_ID || 'com.deepseek.harness' }}
        run: printf 'DSH_DESKTOP_APP_ID=%s\n' "$DSH_DESKTOP_APP_ID" > apps/desktop/.env.linux
      - name: Check packaging configuration and toolchain
        run: pnpm run package:desktop:linux:x64:unsigned --check
      - name: Build AppImage
        run: pnpm run package:desktop:linux:x64:unsigned
      - name: Retain AppImage
        uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-x64-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/*.AppImage
          if-no-files-found: error
          retention-days: 14
