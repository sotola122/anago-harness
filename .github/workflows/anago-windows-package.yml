name: Package Desktop · Windows · x64 (self-signed)

on:
  workflow_dispatch:
  # Pull requests get a manual entry point: label the pull request `package-desktop`.
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'package-desktop'
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Materialize the signing certificate
        env:
          ANAGO_WINDOWS_PFX_BASE64: ${{ secrets.ANAGO_WINDOWS_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANAGO_WINDOWS_PFX_BASE64)) { throw 'ANAGO_WINDOWS_PFX_BASE64 is required' }
          [IO.File]::WriteAllBytes((Join-Path $env:RUNNER_TEMP 'anago-code-signing.pfx'),
            [Convert]::FromBase64String($env:ANAGO_WINDOWS_PFX_BASE64))
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Serve a local Electron mirror
        # GitHub release downloads intermittently answer 504, and @electron/get also fetches SHASUMS256.txt
        # from the same release. Fetch both once through the authenticated API, verify the archive against
        # Electron's published digest, then let the build read them from a loopback mirror.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pkg = Get-Content -LiteralPath 'apps/desktop/package.json' -Raw | ConvertFrom-Json
          $declared = if ($pkg.dependencies.electron) { $pkg.dependencies.electron } else { $pkg.devDependencies.electron }
          $electron = $declared -replace '^[^0-9]*', ''
          if ($electron -ne '44.7.0') { throw "electron moved to $electron; update the digest in this step" }
          $mirror = Join-Path $env:RUNNER_TEMP "mirror/v$electron"
          New-Item -ItemType Directory -Path $mirror -Force | Out-Null
          gh release download "v$electron" -R electron/electron -p "electron-v$electron-win32-x64.zip" -p 'SHASUMS256.txt' -D $mirror --clobber
          $file = Join-Path $mirror "electron-v$electron-win32-x64.zip"
          $actual = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne 'eee30dc8fa1f5ea95490e59f44e46ea68dd24c6e93d22facf70fe5c2d4c2665c') { throw "Electron archive digest mismatch: $actual" }
          Start-Process -FilePath 'node' -ArgumentList @('.github/scripts/local-mirror.cjs', (Join-Path $env:RUNNER_TEMP 'mirror'), '8099') -WindowStyle Hidden
          Start-Sleep -Seconds 3
          $probe = Invoke-WebRequest -Uri "http://127.0.0.1:8099/v$electron/SHASUMS256.txt" -UseBasicParsing -TimeoutSec 20
          if ($probe.StatusCode -ne 200) { throw "The local Electron mirror answered $($probe.StatusCode)" }
          'ELECTRON_MIRROR=http://127.0.0.1:8099/' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Pre-seed the primary runtime archives
        # The build's own downloader dies on truncated release responses from this network. Cache the Node and
        # Python archives the lock file names, after checking each digest, so packaging needs no network.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $lock = Get-Content 'scripts/primary-runtime/lock.json' -Raw | ConvertFrom-Json
          $target = $lock.targets.'win-x64'
          $cache = 'apps/desktop/.desktop-build/downloads'
          New-Item -ItemType Directory -Path $cache -Force | Out-Null
          $nodeName = "node-v$($lock.nodeVersion)-$($target.nodeArchive)"
          $nodeFile = Join-Path $env:RUNNER_TEMP $nodeName
          curl.exe -fsSL --retry 5 --retry-all-errors -o $nodeFile "https://nodejs.org/dist/v$($lock.nodeVersion)/$nodeName"
          $actual = (Get-FileHash -LiteralPath $nodeFile -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $target.nodeSha256) { throw "Node runtime digest mismatch: $actual" }
          Copy-Item -LiteralPath $nodeFile -Destination (Join-Path $cache $target.nodeSha256)
          $pythonName = "cpython-$($lock.pythonVersion)+$($lock.pythonRelease)-$($target.pythonTarget)-install_only_stripped.tar.gz"
          gh release download $lock.pythonRelease -R astral-sh/python-build-standalone -p $pythonName -D $env:RUNNER_TEMP --clobber
          $pythonFile = Join-Path $env:RUNNER_TEMP $pythonName
          $actual = (Get-FileHash -LiteralPath $pythonFile -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $target.pythonSha256) { throw "Python runtime digest mismatch: $actual" }
          Copy-Item -LiteralPath $pythonFile -Destination (Join-Path $cache $target.pythonSha256)
      - name: Write packaging environment
        # The file-owned settings loader passes these two values only to the packaging command and
        # electron-builder; apps/desktop/.env.windows is Git ignored and removed after the job.
        env:
          ANAGO_PFX_PASSWORD: ${{ secrets.ANAGO_PFX_PASSWORD }}
          DSH_DESKTOP_APP_ID: ${{ vars.DSH_DESKTOP_APP_ID || 'com.deepseek.harness' }}
        run: |
          if ([string]::IsNullOrEmpty($env:ANAGO_PFX_PASSWORD)) { throw 'ANAGO_PFX_PASSWORD is required' }
          if ($env:ANAGO_PFX_PASSWORD.Contains("'") -or $env:ANAGO_PFX_PASSWORD.Contains("`n") -or $env:ANAGO_PFX_PASSWORD.Contains("`r")) {
            throw 'ANAGO_PFX_PASSWORD cannot contain an apostrophe or a line break'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'anago-code-signing.pfx'
          if (-not (Test-Path -LiteralPath $pfx -PathType Leaf)) { throw 'The signing certificate was not materialized' }
          $password = ConvertTo-SecureString -String $env:ANAGO_PFX_PASSWORD -AsPlainText -Force
          $expected = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new((Resolve-Path 'apps/desktop/windows-signing/anago-code-signing.cer').Path)
          if ((Get-PfxCertificate -FilePath $pfx -Password $password).Thumbprint -ne $expected.Thumbprint) {
            throw 'The PFX does not contain the committed anago-code-signing.cer certificate'
          }
          @(
            "DSH_DESKTOP_APP_ID='$env:DSH_DESKTOP_APP_ID'"
            "DSH_DESKTOP_WINDOWS_PFX_FILE='$pfx'"
            "DSH_DESKTOP_WINDOWS_PFX_PASSWORD='$env:ANAGO_PFX_PASSWORD'"
            "DSH_DESKTOP_AUTO_UPDATE_ENV='production'"
            "DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN='https://github.com/sotola122/anago-harness/releases/latest/download'"
          ) | Set-Content -LiteralPath 'apps/desktop/.env.windows' -Encoding utf8NoBOM
      - name: Check packaging configuration and toolchain
        run: pnpm run package:desktop:win:x64:self-sign --check
      - name: Build the self-signed installer
        id: self-signed
        continue-on-error: true
        run: pnpm run package:desktop:win:x64:self-sign
      - name: Build the unsigned installer when signing fails
        # The owner needs a Windows binary now; a signing failure must not hide the packaged application.
        if: steps.self-signed.outcome == 'failure'
        run: pnpm run package:desktop:win:x64:unsigned
      - name: Verify signatures
        if: always()
        continue-on-error: true
        run: |
          $artifacts = 'apps/desktop/.desktop-build/targets/win-x64/self-signed-artifacts'
          if (-not (Test-Path -LiteralPath $artifacts)) { Write-Host 'no self-signed artifacts'; exit 0 }
          $files = @(
            Get-ChildItem -LiteralPath $artifacts -File -Filter '*.exe' | ForEach-Object FullName
            Get-ChildItem -LiteralPath (Join-Path $artifacts 'win-unpacked') -Recurse -File |
              Where-Object { $_.Extension -in '.exe', '.dll' } | ForEach-Object FullName
            'apps/desktop/.desktop-build/targets/win-x64/installer-ui/window-frame.dll'
          )
          & apps/desktop/windows-signing/anago-verify.ps1 $files
      - name: Stage the installer and trust files
        if: always()
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "anago-windows-x64-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          foreach ($name in 'self-signed-artifacts', 'unsigned-artifacts') {
            $from = "apps/desktop/.desktop-build/targets/win-x64/$name/*.exe"
            Copy-Item -Path $from -Destination $stage -ErrorAction SilentlyContinue
          }
          Copy-Item -Path 'apps/desktop/windows-signing/anago-code-signing.cer' -Destination $stage
          Copy-Item -Path 'apps/desktop/windows-signing/anago-trust.txt' -Destination $stage
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: windows-x64-self-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/anago-windows-x64-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
      - name: Show the packaging evidence
        if: failure()
        run: |
          $run = Get-ChildItem 'apps/desktop/.desktop-build/packaging-runs' -Directory -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime | Select-Object -Last 1
          if ($null -eq $run) { Write-Host 'no packaging run directory'; exit 0 }
          Get-Content -LiteralPath (Join-Path $run.FullName 'events.jsonl') -Tail 60
          Get-Content -LiteralPath (Join-Path $run.FullName 'stderr.log') -Tail 40 -ErrorAction SilentlyContinue
      - name: Remove the PFX and packaging environment
        if: always()
        run: |
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'anago-code-signing.pfx') -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath 'apps/desktop/.env.windows' -Force -ErrorAction SilentlyContinue
