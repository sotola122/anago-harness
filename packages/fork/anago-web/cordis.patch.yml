# anago-web: the fork's browser layer over dsh-web-app.
- insert:
    # A client half attaches only to the row whose specifier is the bare
    # package name.
    - id: ui-settings-web-search-providers
      name: '@anago-harness/client-ui-settings-web-search'

# The upstream DeepSeek search card writes the same web.searchProvider field.
# Disable it until the DeepSeek search rows are removed.
- id: ui-settings-web-search
  name: '@deepseek-ai/dsh-client-ui-settings-web-search'
  disabled: true

# The fork ships no Japanese dictionary; pin English so a browser that prefers
# another language never lands on Chinese.
- id: locale
  name: '@deepseek-ai/dsh-client-locale'
  config:
    preference: en

# Japanese-first typography (UDEV Gothic, Intel One Mono, Noto Sans JP). The
# row is new, so it needs an insert patch rather than an entry patch.
- insert:
    - id: anago-fonts
      name: '@anago-harness/client-ui-fonts-anago'

# The account and message-feedback UI link to DeepSeek CN endpoints from the
# browser, which the Node egress guard cannot intercept.
- id: ui-settings-account
  disabled: true
- id: account-controller
  disabled: true
- id: ui-message-feedback
  disabled: true
- id: ui-deepseek-model-label-1017
  disabled: true
