# anago-web: the fork's browser layer over dsh-web-app.
- insert:
    # A client half attaches only to the row whose specifier is the bare
    # package name.
    - id: ui-settings-web-search-providers
      name: '@anago-harness/client-ui-settings-web-search'

# The upstream DeepSeek search card writes the same web.searchProvider field.
# Disable it until the DeepSeek search rows are removed.
- id: ui-settings-web-search
  name: '@deepseek-ai/dsh-client-ui-settings-web-search'
  disabled: true

# The fork ships a Japanese dictionary with English fallback. Pin Japanese so
# the shell never lands on Chinese or on an English-defaulted surface.
- id: locale
  name: '@deepseek-ai/dsh-client-locale'
  config:
    preference: ja

# Japanese language pack (partial dictionaries over the English fallback) and
# Japanese-first typography (UDEV Gothic, Intel One Mono, Noto Sans JP). Both
# are new rows, so they need an insert patch rather than an entry patch.
- insert:
    - id: anago-locale-ja
      name: '@anago-harness/client-locale-ja'
    - id: anago-fonts
      name: '@anago-harness/client-ui-fonts-anago'
